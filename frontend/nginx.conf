server {
  # 8083, not 80: this runs as a non-root user (uid 10001, see Dockerfile), which
  # can't bind privileged ports (<1024). 8083 also matches the host-side port in
  # compose.yaml, kept identical on both sides so there's one port number to track,
  # not a host:container split. The k8s Service will map 80 -> 8083 externally.
  listen 8083;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Vite's JS/CSS filenames are content-hashed (index-xxxx.js), so it's safe
  # to cache them aggressively -- a new build always gets a new filename.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must never be cached: it's what references the current
  # hashed asset filenames, so a stale copy would point at deleted files.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # React Router paths like /movies/5 have no matching file on disk --
  # fall back to index.html and let the client-side router handle it.
  location / {
    try_files $uri /index.html;
  }
}
