name: Promote to Production

on:
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Checkout ticket-sale-config
        uses: actions/checkout@v7
        with:
          repository: baha0x13/ticket-sale-config
          token: ${{ secrets.GITOPS_TOKEN }}
          path: ticket-sale-config

      - name: Read the tag currently running in staging
        id: staging_tag
        working-directory: ticket-sale-config
        run: |
          TAG=$(grep -m1 "newTag:" overlays/staging/kustomization.yaml | awk '{print $2}')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Promote that exact tag to prod
        working-directory: ticket-sale-config
        run: |
          sed -i "s/newTag: .*/newTag: ${{ steps.staging_tag.outputs.tag }}/" overlays/prod/kustomization.yaml
          git diff overlays/prod/kustomization.yaml

      - name: Commit and push
        working-directory: ticket-sale-config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add overlays/prod/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Prod is already running this tag - nothing to promote"
            exit 0
          fi
          git commit -m "promote ${{ steps.staging_tag.outputs.tag }} to prod"
          git push
